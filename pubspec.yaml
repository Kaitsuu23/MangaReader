name: manga_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.3.5

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  cached_network_image: ^4.0.5
  shared_preferences: ^2.5.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.3
  google_fonts: ^9.0.0
  photo_view: ^0.15.0
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^4.0.0
  flutter_svg: ^2.3.0
  flutter_cache_manager: ^3.4.1
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  url_launcher: ^6.3.3
  archive: ^4.6.0
  file_picker: ^13.3.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.10.10
  app_badge_plus: ^1.4.0
  local_auth: ^3.0.2
  google_mlkit_text_recognition: ^1.0.3
  google_mlkit_translation: ^1.0.3
  google_mlkit_language_id: ^1.0.3
  image: ^4.13.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon_legacy.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon_legacy.png"

flutter:
  uses-material-design: true

  assets:
    - assets/